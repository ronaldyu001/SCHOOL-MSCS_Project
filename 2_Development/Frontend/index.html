<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dataset and memory pipeline console for the Memory Query Rewriter project: load LoCoMo, split it, prepare the partitions, and index them into the frozen memory store."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Memory Query Rewriter</title>
    <style>
      /* Inline, because a stylesheet request would defeat the point. Mirrors
         the canvas and accent tokens for both themes. */
      .boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background-color: #f6f7f8;
        color: #0f6b63;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, system-ui,
          sans-serif;
      }
      .boot-splash p {
        margin: 0;
        font-size: 0.8125rem;
        color: #57636d;
      }
      @media (prefers-color-scheme: dark) {
        .boot-splash {
          background-color: #0a0d10;
          color: #4ecbbf;
        }
        .boot-splash p {
          color: #97a4b0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by BootGate as soon as React mounts. This exists only so the
           desktop window is never a blank rectangle while the bundle loads. -->
      <div class="boot-splash">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="5.5" cy="12" r="2.25" fill="currentColor" stroke="none" />
          <path d="M11 6.5a7.5 7.5 0 0 1 0 11" />
          <path d="M15.5 3.5a12 12 0 0 1 0 17" opacity="0.55" />
          <path d="M19.75 1.5a16.5 16.5 0 0 1 0 21" opacity="0.28" />
        </svg>
        <p>Starting up…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
